
name: Binance Spot Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: binance-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Binance OHLCV
        run: python refresh_binance_spot.py

      - name: Build CCI WMA radar
        run: python build_radar.py

      - name: Commit updated CSV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/binance/ data/radar/
          if ! git diff --cached --quiet; then
            git commit -m "Auto update Binance Spot OHLCV"
            git push
          else
            echo "No changes"
          fi
