name: Forex Weekly Mandatory Entry 0.1pct SL Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forex_model_a/backtest_weekly_01pct_sl.py'
      - '.github/workflows/forex_weekly_01pct_sl.yml'

permissions:
  contents: write

jobs:
  weekly-01pct:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pip install -r forex_model_a/requirements.txt
      - name: Run weekly backtest
        working-directory: forex_model_a
        run: python -u backtest_weekly_01pct_sl.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_model_a/weekly_01pct_sl_results/
          if ! git diff --cached --quiet; then
            git commit -m "Update Forex 1W 0.1pct stop-loss backtest"
            git pull --rebase
            git push
          fi
