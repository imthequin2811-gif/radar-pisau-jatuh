name: Compare Model A Forex 6D vs 12D

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forex_model_a/backtest_model_a_6d12d.py'
      - '.github/workflows/forex_compare_6d12d.yml'

permissions:
  contents: write

jobs:
  compare-6d-12d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node for Dukascopy
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install -r forex_model_a/requirements.txt
      - name: Backtest both custom timeframes
        working-directory: forex_model_a
        run: python -u backtest_model_a_6d12d.py
      - name: Save comparison CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_model_a/model_a_6d12d_results/
          if ! git diff --cached --quiet; then
            git commit -m "Backtest Model A Forex 6D vs 12D"
            git pull --rebase
            git push
          fi
