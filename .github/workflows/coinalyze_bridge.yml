name: Coinalyze OI Funding Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # 10:17 WIB, after UTC daily close
  pull_request:
    paths:
      - 'coinalyze/**'
      - '.github/workflows/coinalyze_bridge.yml'

permissions:
  contents: write

concurrency:
  group: coinalyze-bridge
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile coinalyze/collect.py
      - name: Validate annual CLOSED 6D CCI18 WMA6
        run: python coinalyze/collect.py --self-test

  collect:
    needs: selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check API key exists
        id: key
        run: |
          if [ -n "$COINALYZE_API_KEY" ]; then
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "Skipped: add COINALYZE_API_KEY repository secret"
          fi
      - name: Fetch official metrics and build separate derivatives radar
        if: steps.key.outputs.configured == 'yes'
        run: python coinalyze/collect.py --assets BTC,ETH,SOL,BNB,TAO,FET,HOT,RSR,JCT,AIOT --per-asset 1 --lookback-days 1460
      - name: Commit only additive Coinalyze data
        if: steps.key.outputs.configured == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coinalyze/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Coinalyze derivatives metrics and CLOSED radar"
            git pull --rebase
            git push
          fi
