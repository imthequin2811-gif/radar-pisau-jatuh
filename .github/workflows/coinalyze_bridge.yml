name: Coinalyze OI Funding Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 07:00 WIB, UTC daily close
  pull_request:
    paths:
      - 'coinalyze/**'
      - '.github/workflows/coinalyze_bridge.yml'
      - 'refresh_binance_spot.py'

permissions:
  contents: write

concurrency:
  group: coinalyze-bridge
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile coinalyze/collect.py coinalyze/daily_report.py
      - name: Validate annual CLOSED 6D CCI18 WMA6
        run: python coinalyze/collect.py --self-test

  collect:
    needs: selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check API key exists
        id: key
        run: |
          if [ -n "$COINALYZE_API_KEY" ]; then
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "Skipped: add COINALYZE_API_KEY repository secret"
          fi
      - name: Refresh spot inputs for the daily report
        continue-on-error: true
        run: python refresh_binance_spot.py
      - name: Fetch official metrics and build separate derivatives radar
        id: derivatives
        continue-on-error: true
        if: steps.key.outputs.configured == 'yes'
        run: python coinalyze/collect.py --assets BTC,ETH,SOL,BNB,TAO,FET,HOT,RSR,JCT,AIOT --per-asset 1 --lookback-days 1460
      - name: Generate daily analysis
        env:
          DERIVATIVES_OUTCOME: ${{ steps.derivatives.outcome }}
        run: |
          if [ "$DERIVATIVES_OUTCOME" = "failure" ]; then
            git restore -- data/coinalyze/
          fi
          python coinalyze/daily_report.py
          cat data/coinalyze/DAILY_WIB.md >> "$GITHUB_STEP_SUMMARY"
          git restore -- data/binance/
      - name: Publish daily analysis and successful Coinalyze refresh
        env:
          DERIVATIVES_OUTCOME: ${{ steps.derivatives.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coinalyze/DAILY_WIB.md
          if [ "$DERIVATIVES_OUTCOME" = "success" ]; then
            git add data/coinalyze/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish 07:00 WIB daily crypto analysis"
            git pull --rebase
            git push
          fi
