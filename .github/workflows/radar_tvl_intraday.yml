name: Radar TVL DeFiLlama Intraday (4H 6H 8H 12H)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar_tvl_intraday.yml'
      - 'scripts/tvl_hourly_to_github.py'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: radar-tvl-defillama-intraday
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture DeFiLlama observed TVL and Binance 1H
        run: python scripts/tvl_hourly_to_github.py

      - name: Commit data (never create synthetic backfill)
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tvl/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Radar TVL: observed hourly snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep "$((attempt*3))"
          done
          echo "Failed to push TVL data" >&2
          exit 1
