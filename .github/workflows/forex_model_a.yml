
name: Model A Forex Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'

permissions:
  contents: write

jobs:
  forex-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r forex_model_a/requirements.txt

      - name: Run Model A Forex monthly CCI20 WMA5 backtest
        working-directory: forex_model_a
        run: python backtest_model_a_monthly.py

      - name: Save results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_model_a/model_a_monthly_results/
          if ! git diff --cached --quiet; then
            git commit -m "Auto update Forex Model A monthly results"
            git push
          else
            echo "No changes to save"
          fi
