name: Forex 12D Three-Model Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forex_model_a/backtest_12d_three_models.py'
      - '.github/workflows/forex_12d_three_models.yml'

permissions:
  contents: write

jobs:
  test-12d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node for Dukascopy
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install requirements
        run: pip install -r forex_model_a/requirements.txt
      - name: Run Forex 12D three-model comparison
        working-directory: forex_model_a
        run: python -u backtest_12d_three_models.py
      - name: Commit CSV results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_model_a/forex_12d_three_models_results/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Forex 12D three-model backtest"
            git pull --rebase
            git push
          fi
