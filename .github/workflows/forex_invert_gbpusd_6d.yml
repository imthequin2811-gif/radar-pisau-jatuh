name: Test Inverted GBPUSD 6D Liquidity Sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forex_model_a/backtest_invert_gbpusd_6d.py'
      - '.github/workflows/forex_invert_gbpusd_6d.yml'

permissions:
  contents: write

jobs:
  inverse-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pip install -r forex_model_a/requirements.txt
      - name: Test inverse 6D sweep
        working-directory: forex_model_a
        run: python -u backtest_invert_gbpusd_6d.py
      - name: Save CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_model_a/model_a_inverted_gbpusd_6d_results/
          if ! git diff --cached --quiet; then
            git commit -m "Update inverse GBPUSD 6D backtest"
            git pull --rebase
            git push
          fi
