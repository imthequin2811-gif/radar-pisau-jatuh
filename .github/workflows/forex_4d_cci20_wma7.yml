name: Forex 4D CCI20 WMA7 Mandatory Entry 20x Stress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forex_model_a/backtest_4d_cci20_wma7.py'
      - '.github/workflows/forex_4d_cci20_wma7.yml'

permissions:
  contents: write

jobs:
  test-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node for Dukascopy
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install requirements
        run: pip install -r forex_model_a/requirements.txt
      - name: Backtest CCI20 WMA7 4D
        working-directory: forex_model_a
        run: python -u backtest_4d_cci20_wma7.py
      - name: Publish backtest result CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_model_a/forex_4d_cci20_wma7_results/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 4D CCI20 WMA7 Forex backtest"
            git pull --rebase
            git push
          fi
