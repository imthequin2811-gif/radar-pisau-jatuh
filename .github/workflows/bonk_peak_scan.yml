name: BONK Candidate Peak OI Scan (CMC x Coinalyze)
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/bonk_peak_oi/scan.py'
      - '.github/workflows/bonk_peak_scan.yml'
permissions:
  contents: write
concurrency:
  group: bonk-peak-oi-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical candidate scan using API key secret
        run: python research/bonk_peak_oi/scan.py
      - name: Publish only nonsecret numeric results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/bonk_peak_oi/results.csv research/bonk_peak_oi/results.md research/bonk_peak_oi/diagnostics.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh BONK candidate peak OI scan"
            git pull --rebase
            git push
          fi
